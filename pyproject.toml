[project]
name = "mnist-cnn"
version = "0.1.0"
description = "MNIST Digit Recognizer with separate Frontend and Backend"
readme = "README.md"
requires-python = ">=3.10"
package-mode = false
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "streamlit>=1.35.0",
    "streamlit-drawable-canvas>=0.9.3",
    "requests>=2.31.0",
    "pandas>=2.0.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true